html,body{margin:0;height:100%;background:var(--bg);font-family:Georgia,serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;left:50%;top:env(safe-area-inset-top,0px);transform:translateX(-50%);image-rendering:pixelated;border-bottom:3px solid var(--bd)}
#hud{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 6px);font-size:11px;pointer-events:none;color:var(--tx)}
#goal{display:inline-block;background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:3px 8px;font-style:italic}
.chip{display:inline-block;background:var(--card);border:2px solid var(--bd);border-radius:99px;padding:1px 8px;margin:4px 4px 0 0;color:var(--tx)}
#msg,#end{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);background:var(--card);color:var(--tx);border:3px solid var(--bd);border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.45;display:none;box-shadow:0 4px 0 #d98aa0}
#msg::before,.av{content:"";float:left;width:52px;height:52px;margin-right:10px;border-radius:50%;background:var(--pt) 50% 26%/260% no-repeat;border:2px solid var(--ac)}
#end{bottom:calc(env(safe-area-inset-bottom,0px) + 20px);text-align:center}#end .av{float:none;width:90px;height:90px;margin:0 auto 8px;display:block}
#st{position:fixed;left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:104px;height:104px;border-radius:50%;border:3px solid var(--bd);background:rgba(255,200,215,.12)}
#kn{position:absolute;left:32px;top:32px;width:40px;height:40px;border-radius:50%;background:var(--ac);opacity:.85}
#act{position:fixed;right:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 38px);min-width:100px;max-width:44vw;padding:16px 14px;border-radius:30px;border:3px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:14px;display:none;box-shadow:0 4px 0 #d98aa0}
.ov{position:fixed;inset:0;background:rgba(43,27,46,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px;z-index:5;color:#ffe9ef}
.ov h1{margin:0;font-size:26px}.ov p{margin:0;max-width:340px;line-height:1.5;font-size:15px}
.ov .av{float:none;width:130px;height:130px;margin:0}
button.b{font:inherit;font-size:16px;padding:12px 28px;border-radius:30px;border:0;background:var(--ac);color:#fff;box-shadow:0 4px 0 #b9627f}
#cd{font:inherit;font-size:28px;width:170px;text-align:center;letter-spacing:8px;background:#fff0f4;color:var(--tx);border:3px solid var(--bd);border-radius:10px;padding:8px}

#dlg{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);background:var(--card);color:var(--tx);border:3px solid var(--bd);border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.45;display:none;box-shadow:0 4px 0 #d98aa0;min-height:64px;z-index:4}
#dlg .av,#bp{float:left;width:52px;height:52px;margin:0 10px 0 0;border-radius:50%;border:2px solid var(--ac)}
#nm{font-weight:bold;color:#d0607f;font-size:13px}#nx{float:right;color:var(--ac)}
#ch{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);display:none;gap:18px;justify-content:center;z-index:6}
